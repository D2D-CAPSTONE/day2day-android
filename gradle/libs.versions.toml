[versions]
agp = "8.4.1"
spotless = "7.2.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
playServicesMaps = "20.0.0"
playServicesLocation = "21.0.1"
